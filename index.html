<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروژه اسفندیار</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f3f5f9; color: #172033;
      font: 14px/1.8 Tahoma, 'Segoe UI', Arial, sans-serif;
    }
    .wrap { max-width: 1250px; margin: auto; padding: 20px; }
    .panel {
      background: white; border: 1px solid #e3e7ee; border-radius: 12px;
      padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); margin-bottom: 20px;
    }
    h2, h3 { margin-top: 0; color: #0f172a; }
    button, input, select, textarea {
      font-family: inherit; font-size: 13px; padding: 8px 12px;
      border: 1px solid #cbd5e1; border-radius: 8px; outline: none;
    }
    button {
      background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: right; vertical-align: middle; }
    th { background: #f8fafc; color: #334155; }
    .hidden { display: none !important; }
    .flex { display: flex; gap: 10px; align-items: center; }
    .space-between { justify-content: space-between; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #fee2e2; color: #991b1b; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    .file-chip {
      display: inline-block; background: #e2e8f0; padding: 3px 8px; border-radius: 4px;
      font-size: 12px; margin: 2px; text-decoration: none; color: #1e293b;
    }
    .file-chip:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- بخش ورود امن (کادرهای کاملاً خالی) -->
    <div id="loginPanel" class="panel" style="max-width: 400px; margin: 60px auto;">
      <h2 style="text-align: center;">ورود به سامانه اسفندیار</h2>
      <div id="loginError" class="alert hidden"></div>
      <form onsubmit="event.preventDefault(); handleLogin();">
        <div style="margin-bottom: 15px;">
          <label>نام کاربری:</label><br>
          <input type="text" id="loginUser" style="width: 100%; margin-top: 5px;" placeholder="نام کاربری" required autocomplete="username">
        </div>
        <div style="margin-bottom: 20px;">
          <label>رمز عبور:</label><br>
          <input type="password" id="loginPass" style="width: 100%; margin-top: 5px;" placeholder="رمز عبور" required autocomplete="current-password">
        </div>
        <button type="submit" style="width: 100%; padding: 10px;">ورود به سیستم</button>
      </form>
    </div>

    <!-- پنل اصلی برنامه -->
    <div id="appPanel" class="panel hidden">
      <div class="flex space-between" style="margin-bottom: 20px;">
        <h2>پروژه اسفندیار (سامانه ردیابی پیشرفت)</h2>
        <div class="flex">
          <span id="userInfo" style="font-weight: bold; color: #475569;"></span>
          <button class="danger" onclick="handleLogout()">خروج</button>
        </div>
      </div>

      <!-- کنترل‌های ادمین -->
      <div id="adminControls" class="hidden">
        <!-- فرم افزودن فعالیت جدید -->
        <div class="card">
          <h3>➕ اضافه کردن فعالیت جدید</h3>
          <div style="display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="newTaskDesc" placeholder="شرح کار جدید..." required>
            
            <!-- تاریخ شمسی کشویی با انتخاب خودکار روز جاری -->
            <div class="flex" style="gap: 5px;">
              <select id="shamsiDay" style="width: 70px;"></select>
              <select id="shamsiMonth" style="width: 110px;"></select>
              <select id="shamsiYear" style="width: 80px;"></select>
            </div>

            <!-- انتخاب پیگیری‌کننده (کاربران ثبت شده) -->
            <select id="newTaskAssignee"></select>
          </div>

          <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 10px;">
            <textarea id="newTaskDetails" placeholder="توضیحات تکمیلی..." rows="2"></textarea>
            <div>
              <label style="font-size: 12px; font-weight: bold;">📎 پیوست فایل‌ها و تصاویر:</label>
              <input type="file" id="newTaskFiles" multiple style="width: 100%; margin-top: 4px;" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip">
              <span id="fileCountText" style="font-size: 11px; color: #64748b;">هیچ فایلی انتخاب نشده</span>
            </div>
          </div>

          <button onclick="addTask()" style="padding: 10px 20px;">ثبت فعالیت در دیتابیس</button>
        </div>

        <!-- فرم ساخت کاربر جدید -->
        <div class="card">
          <h3>👤 ایجاد کاربر جدید (همکاران)</h3>
          <div class="flex" style="flex-wrap: wrap;">
            <input type="text" id="newUserName" placeholder="نام و نام خانوادگی">
            <input type="text" id="newUserUsername" placeholder="نام کاربری (انگلیسی)">
            <input type="password" id="newUserPassword" placeholder="رمز عبور">
            <button class="success" onclick="createUser()">ساخت کاربر</button>
          </div>
        </div>
      </div>

      <!-- جدول اصلی فعالیت‌ها -->
      <h3>جدول فعالیت‌ها</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">ردیف</th>
              <th>شرح کار</th>
              <th style="width: 120px;">تاریخ انجام</th>
              <th style="width: 120px;">پیگیری‌کننده</th>
              <th>توضیحات و مدارک پیوست</th>
              <th style="width: 140px;">پیشرفت کار</th>
              <th id="actionTh" class="hidden" style="width: 70px;">عملیات</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // اطلاعات دیتابیس Supabase
    const SUPABASE_URL = 'https://bdieqelvtlcwlgjgylmb.supabase.co';
    const SUPABASE_KEY = 'GAPGPTMASKTOKENdt1nsf5y4rwX0X';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let tasks = [];
    let users = [];

    // محاسبه تاریخ روز شمسی بر اساس تاریخ میلادی سیستم
    function getTodayShamsi() {
      const gDate = new Date();
      const gy = gDate.getFullYear();
      const gm = gDate.getMonth() + 1;
      const gd = gDate.getDate();

      const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
      let jy = (gy <= 1600) ? 0 : 979;
      let gy2 = (gy <= 1600) ? gy - 621 : gy - 1600;
      let days = (365 * gy2) + (parseInt((gy2 + 3) / 4)) - (parseInt((gy2 + 99) / 100)) + (parseInt((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
      jy += 33 * (parseInt(days / 12053));
      days %= 12053;
      jy += 4 * (parseInt(days / 1461));
      days %= 1461;
      jy += parseInt((days - 1) / 365);
      if (days > 365) days = (days - 1) % 365;
      let jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
      let jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));

      return { y: jy, m: jm, d: jd };
    }

    // مقداردهی کشویی‌های تاریخ شمسی
    function initShamsiPickers() {
      const daySel = document.getElementById('shamsiDay');
      const monthSel = document.getElementById('shamsiMonth');
      const yearSel = document.getElementById('shamsiYear');
      if (!daySel || !monthSel || !yearSel) return;

      daySel.innerHTML = '';
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement('option');
        opt.value = i < 10 ? '0' + i : '' + i;
        opt.textContent = opt.value;
        daySel.appendChild(opt);
      }

      const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
      monthSel.innerHTML = '';
      months.forEach((m, idx) => {
        const opt = document.createElement('option');
        const num = idx + 1;
        opt.value = num < 10 ? '0' + num : '' + num;
        opt.textContent = `${opt.value} - ${m}`;
        monthSel.appendChild(opt);
      });

      yearSel.innerHTML = '';
      for (let y = 1403; y <= 1410; y++) {
        const opt = document.createElement('option');
        opt.value = '' + y;
        opt.textContent = opt.value;
        yearSel.appendChild(opt);
      }

      // تنظیم پیش‌فرض به تاریخ امروز
      const today = getTodayShamsi();
      daySel.value = today.d < 10 ? '0' + today.d : '' + today.d;
      monthSel.value = today.m < 10 ? '0' + today.m : '' + today.m;
      yearSel.value = '' + today.y;
    }

    // لاگین
    async function handleLogin() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');

      const { data, error } = await supabaseClient
        .from('app_users')
        .select('*')
        .eq('username', u)
        .eq('password', p)
        .maybeSingle();

      if (error || !data) {
        errBox.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      currentUser = data;
      sessionStorage.setItem('esfandiar_user', JSON.stringify(currentUser));
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      initApp();
    }

    function handleLogout() {
      currentUser = null;
      sessionStorage.removeItem('esfandiar_user');
      document.getElementById('appPanel').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
    }

    async function loadData() {
      // فقط کاربران غیر از admin و ali خوانده شوند
      const uRes = await supabaseClient.from('app_users').select('*');
      if (uRes.data) {
        users = uRes.data.filter(u => u.username !== 'admin' && u.username !== 'ali');
      }

      const tRes = await supabaseClient.from('tasks').select('*').order('id', { ascending: true });
      if (tRes.data) tasks = tRes.data;

      renderTasks();
      renderAssignees();
    }

    async function initApp() {
      initShamsiPickers();
      const saved = sessionStorage.getItem('esfandiar_user');
      if (!saved) {
        document.getElementById('loginPanel').classList.remove('hidden');
        document.getElementById('appPanel').classList.add('hidden');
        return;
      }
      currentUser = JSON.parse(saved);
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('appPanel').classList.remove('hidden');
      document.getElementById('userInfo').textContent = `کاربر: ${currentUser.name || currentUser.username} (${currentUser.role === 'admin' ? 'مدیر' : 'همکار'})`;

      if (currentUser.role === 'admin') {
        document.getElementById('adminControls').classList.remove('hidden');
        document.getElementById('actionTh').classList.remove('hidden');
      } else {
        document.getElementById('adminControls').classList.add('hidden');
        document.getElementById('actionTh').classList.add('hidden');
      }

      await loadData();
    }

    function renderAssignees() {
      const sel = document.getElementById('newTaskAssignee');
      if (!sel) return;
      sel.innerHTML = '<option value="">انتخاب پیگیری‌کننده...</option>';
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.username;
        opt.textContent = `${u.name || u.username} (${u.username})`;
        sel.appendChild(opt);
      });
    }

    function renderTasks() {
      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = '';

      if (tasks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b;">هنوز فعالیتی ثبت نشده است.</td></tr>`;
        return;
      }

      tasks.forEach((t, index) => {
        const tr = document.createElement('tr');
        const isAdmin = currentUser.role === 'admin';
        const isMyTask = t.assignee === currentUser.username;
        const canEditProgress = isAdmin || isMyTask;

        // ساخت لینک فایل‌های پیوست
        let filesHtml = '';
        if (Array.isArray(t.files) && t.files.length > 0) {
          filesHtml = '<div style="margin-top: 5px;">' + t.files.map(f => `
            <a href="${f.data}" download="${f.name}" class="file-chip" title="دانلود فایل">
              📎 ${f.name}
            </a>
          `).join('') + '</div>';
        }

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><b>${t.description || ''}</b></td>
          <td>${t.due_date || '-'}</td>
          <td>${t.assignee || '-'}</td>
          <td>
            <input type="text" value="${t.details || ''}" 
                   onchange="updateDetails(${t.id}, this.value)" 
                   ${canEditProgress ? '' : 'disabled'} style="width: 100%; margin-bottom: 3px;">
            ${filesHtml}
          </td>
          <td>
            <select onchange="updateProgress(${t.id}, this.value)" ${canEditProgress ? '' : 'disabled'}>
              <option value="انجام نشده" ${t.progress === 'انجام نشده' ? 'selected' : ''}>انجام نشده</option>
              <option value="در حال انجام" ${t.progress === 'در حال انجام' ? 'selected' : ''}>در حال انجام</option>
              <option value="تکمیل شده" ${t.progress === 'تکمیل شده' ? 'selected' : ''}>تکمیل شده</option>
            </select>
          </td>
          ${isAdmin ? `<td><button class="danger" onclick="deleteTask(${t.id})">حذف</button></td>` : ''}
        `;
        tbody.appendChild(tr);
      });
    }

    // خواندن فایل‌ها به صورت Data URL جهت ذخیره مطمئن در دیتابیس
    function readFilesAsync(fileList) {
      return Promise.all(Array.from(fileList).map(file => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve({ name: file.name, data: reader.result });
          reader.readAsDataURL(file);
        });
      }));
    }

    async function addTask() {
      const desc = document.getElementById('newTaskDesc').value.trim();
      const d = document.getElementById('shamsiDay').value;
      const m = document.getElementById('shamsiMonth').value;
      const y = document.getElementById('shamsiYear').value;
      const dueDate = `${y}/${m}/${d}`;

      const assignee = document.getElementById('newTaskAssignee').value;
      const details = document.getElementById('newTaskDetails').value.trim();
      const fileInput = document.getElementById('newTaskFiles');

      if (!desc) {
        alert('لطفاً شرح کار را وارد کنید.');
        return;
      }

      let attachedFiles = [];
      if (fileInput.files.length > 0) {
        attachedFiles = await readFilesAsync(fileInput.files);
      }

      const { error } = await supabaseClient.from('tasks').insert([
        {
          description: desc,
          due_date: dueDate,
          assignee: assignee,
          details: details,
          files: attachedFiles,
          progress: 'انجام نشده'
        }
      ]);

      if (error) {
        alert('خطا در ثبت فعالیت: ' + error.message);
        return;
      }

      // ریست کردن فرم
      document.getElementById('newTaskDesc').value = '';
      document.getElementById('newTaskDetails').value = '';
      fileInput.value = '';
      document.getElementById('fileCountText').textContent = 'هیچ فایلی انتخاب نشده';
      initShamsiPickers();
      loadData();
    }

    async function createUser() {
      const name = document.getElementById('newUserName').value.trim();
      const username = document.getElementById('newUserUsername').value.trim();
      const password = document.getElementById('newUserPassword').value.trim();

      if (!name || !username || !password) {
        alert('لطفاً همه فیلدهای مشخصات کاربر را تکمیل کنید.');
        return;
      }

      const { error } = await supabaseClient.from('app_users').insert([
        { name: name, username: username, password: password, role: 'user' }
      ]);

      if (error) {
        alert('خطا در ساخت کاربر: ' + error.message);
        return;
      }

      alert(`کاربر ${name} با موفقیت ساخته شد.`);
      document.getElementById('newUserName').value = '';
      document.getElementById('newUserUsername').value = '';
      document.getElementById('newUserPassword').value = '';
      loadData();
    }

    async function updateProgress(id, val) {
      await supabaseClient.from('tasks').update({ progress: val }).eq('id', id);
    }

    async function updateDetails(id, val) {
      await supabaseClient.from('tasks').update({ details: val }).eq('id', id);
    }

    async function deleteTask(id) {
      if (!confirm('آیا از حذف این ردیف مطمئن هستید؟')) return;
      await supabaseClient.from('tasks').delete().eq('id', id);
      loadData();
    }

    document.getElementById('newTaskFiles')?.addEventListener('change', function() {
      const count = this.files.length;
      document.getElementById('fileCountText').textContent = count > 0 ? `${count} فایل انتخاب شد.` : 'هیچ فایلی انتخاب نشده';
    });

    window.onload = initApp;
  </script>
</body>
</html>
