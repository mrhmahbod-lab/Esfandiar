<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروژه اسفندیار</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f3f5f9; color: #172033;
      font: 14px/1.8 Tahoma, 'Segoe UI', Arial, sans-serif;
    }
    .wrap { max-width: 1200px; margin: auto; padding: 20px; }
    .panel {
      background: white; border: 1px solid #e3e7ee; border-radius: 12px;
      padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); margin-bottom: 20px;
    }
    h2, h3 { margin-top: 0; color: #0f172a; }
    button, input, select, textarea {
      font-family: inherit; font-size: 14px; padding: 8px 12px;
      border: 1px solid #cbd5e1; border-radius: 8px; outline: none;
    }
    button {
      background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    button.success { background: #16a34a; }
    button.success:hover { background: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: right; vertical-align: middle; }
    th { background: #f8fafc; color: #334155; }
    .hidden { display: none !important; }
    .flex { display: flex; gap: 10px; align-items: center; }
    .space-between { justify-content: space-between; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #fee2e2; color: #991b1b; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- بخش لاگین (کادرهای خالی بدون مقدار پیش‌فرض) -->
    <div id="loginPanel" class="panel" style="max-width: 400px; margin: 60px auto;">
      <h2 style="text-align: center;">ورود به سامانه اسفندیار</h2>
      <div id="loginError" class="alert hidden"></div>
      <form onsubmit="event.preventDefault(); handleLogin();">
        <div style="margin-bottom: 15px;">
          <label>نام کاربری:</label><br>
          <input type="text" id="loginUser" style="width: 100%; margin-top: 5px;" placeholder="نام کاربری خود را وارد کنید" required autocomplete="username">
        </div>
        <div style="margin-bottom: 20px;">
          <label>رمز عبور:</label><br>
          <input type="password" id="loginPass" style="width: 100%; margin-top: 5px;" placeholder="رمز عبور" required autocomplete="current-password">
        </div>
        <button type="submit" style="width: 100%; padding: 10px;">ورود به سیستم</button>
      </form>
    </div>

    <!-- بخش اصلی برنامه -->
    <div id="appPanel" class="panel hidden">
      <div class="flex space-between" style="margin-bottom: 20px;">
        <h2>پروژه اسفندیار (سامانه پیگیری کارها)</h2>
        <div class="flex">
          <span id="userInfo" style="font-weight: bold; color: #475569;"></span>
          <button class="danger" onclick="handleLogout()">خروج</button>
        </div>
      </div>

      <!-- کنترل‌های مخصوص مدیر: افزودن فعالیت و ساخت کاربر جدید -->
      <div id="adminControls" class="hidden">
        <!-- فرم تعریف فعالیت جدید -->
        <div class="card">
          <h3>➕ اضافه کردن فعالیت جدید</h3>
          <div class="flex" style="flex-wrap: wrap;">
            <input type="text" id="newTaskDesc" placeholder="شرح کار..." style="flex: 2; min-width: 200px;">
            <input type="text" id="newTaskDate" placeholder="تاریخ انجام (مثلا ۱۴۰۵/۰۲/۱۵)" style="flex: 1; min-width: 140px;">
            <select id="newTaskAssignee" style="flex: 1; min-width: 140px;"></select>
            <button onclick="addTask()">ثبت فعالیت</button>
          </div>
        </div>

        <!-- فرم ایجاد کاربر جدید برای همکاران -->
        <div class="card">
          <h3>👤 ایجاد کاربر جدید (همکاران)</h3>
          <div class="flex" style="flex-wrap: wrap;">
            <input type="text" id="newUserName" placeholder="نام و نام خانوادگی" style="flex: 1; min-width: 130px;">
            <input type="text" id="newUserUsername" placeholder="نام کاربری (انگلیسی)" style="flex: 1; min-width: 130px;">
            <input type="password" id="newUserPassword" placeholder="رمز عبور" style="flex: 1; min-width: 130px;">
            <button class="success" onclick="createUser()">ساخت کاربر</button>
          </div>
        </div>
      </div>

      <!-- جدول نمایش فعالیت‌ها -->
      <h3>لیست فعالیت‌ها</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th style="width: 50px;">ردیف</th>
              <th>شرح کار</th>
              <th style="width: 130px;">تاریخ انجام</th>
              <th style="width: 130px;">پیگیری‌کننده</th>
              <th>توضیحات و مدارک</th>
              <th style="width: 130px;">پیشرفت کار</th>
              <th id="actionTh" class="hidden" style="width: 80px;">عملیات</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // اطلاعات دیتابیس Supabase
    const SUPABASE_URL = 'https://bdieqelvtlcwlgjgylmb.supabase.co';
    // اگر کلید جدید را کپی کردید، مقدار زیر را با آن جایگزین کنید:
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkaWVxZWx2dGxjd2xnamd5bG1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwMzM4NzMsImV4cCI6MjEwOTYwOTg3M30.xtOnd9g7uBYSVvbRpYqXzp9zY0sgyKqLan_pceNTfpE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let tasks = [];
    let users = [];

    async function handleLogin() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');

      if (!u || !p) {
        errBox.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید.';
        errBox.classList.remove('hidden');
        return;
      }

      const { data, error } = await supabaseClient
        .from('app_users')
        .select('*')
        .eq('username', u)
        .eq('password', p)
        .maybeSingle();

      if (error || !data) {
        errBox.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      currentUser = data;
      sessionStorage.setItem('esfandiar_user', JSON.stringify(currentUser));
      
      // پاک کردن مقادیر فیلدها بعد از لاگین برای امنیت
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      
      initApp();
    }

    function handleLogout() {
      currentUser = null;
      sessionStorage.removeItem('esfandiar_user');
      document.getElementById('appPanel').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
    }

    async function loadData() {
      const uRes = await supabaseClient.from('app_users').select('*');
      if (uRes.data) users = uRes.data;

      const tRes = await supabaseClient.from('tasks').select('*').order('id', { ascending: true });
      if (tRes.data) tasks = tRes.data;

      renderTasks();
      renderAssignees();
    }

    async function initApp() {
      const saved = sessionStorage.getItem('esfandiar_user');
      if (!saved) {
        document.getElementById('loginPanel').classList.remove('hidden');
        document.getElementById('appPanel').classList.add('hidden');
        return;
      }
      currentUser = JSON.parse(saved);
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('appPanel').classList.remove('hidden');
      document.getElementById('userInfo').textContent = `${currentUser.name || currentUser.username} (${currentUser.role === 'admin' ? 'مدیر' : 'کاربر'})`;

      if (currentUser.role === 'admin') {
        document.getElementById('adminControls').classList.remove('hidden');
        document.getElementById('actionTh').classList.remove('hidden');
      } else {
        document.getElementById('adminControls').classList.add('hidden');
        document.getElementById('actionTh').classList.add('hidden');
      }

      await loadData();
    }

    function renderAssignees() {
      const sel = document.getElementById('newTaskAssignee');
      if (!sel) return;
      sel.innerHTML = '<option value="">انتخاب مسئول...</option>';
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.username;
        opt.textContent = `${u.name || u.username} (${u.username})`;
        sel.appendChild(opt);
      });
    }

    function renderTasks() {
      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = '';

      if (tasks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b;">فعالیتی یافت نشد.</td></tr>`;
        return;
      }

      tasks.forEach((t, index) => {
        const tr = document.createElement('tr');
        const isAdmin = currentUser.role === 'admin';
        const isMyTask = t.assignee === currentUser.username;
        const canEdit = isAdmin || isMyTask;

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${t.description || ''}</td>
          <td>${t.due_date || ''}</td>
          <td>${t.assignee || '-'}</td>
          <td>
            <input type="text" value="${t.details || ''}" 
                   onchange="updateDetails(${t.id}, this.value)" 
                   ${canEdit ? '' : 'disabled'} style="width: 100%;">
          </td>
          <td>
            <select onchange="updateProgress(${t.id}, this.value)" ${canEdit ? '' : 'disabled'}>
              <option value="انجام نشده" ${t.progress === 'انجام نشده' ? 'selected' : ''}>انجام نشده</option>
              <option value="در حال انجام" ${t.progress === 'در حال انجام' ? 'selected' : ''}>در حال انجام</option>
              <option value="تکمیل شده" ${t.progress === 'تکمیل شده' ? 'selected' : ''}>تکمیل شده</option>
            </select>
          </td>
          ${isAdmin ? `<td><button class="danger" onclick="deleteTask(${t.id})">حذف</button></td>` : ''}
        `;
        tbody.appendChild(tr);
      });
    }

    async function addTask() {
      const desc = document.getElementById('newTaskDesc').value.trim();
      const date = document.getElementById('newTaskDate').value.trim();
      const assignee = document.getElementById('newTaskAssignee').value;

      if (!desc) {
        alert('لطفاً شرح کار را وارد کنید.');
        return;
      }

      const { error } = await supabaseClient.from('tasks').insert([
        { description: desc, due_date: date, assignee: assignee, progress: 'انجام نشده', details: '' }
      ]);

      if (error) {
        alert('خطا در ثبت: ' + error.message);
        return;
      }

      document.getElementById('newTaskDesc').value = '';
      document.getElementById('newTaskDate').value = '';
      loadData();
    }

    async function createUser() {
      const name = document.getElementById('newUserName').value.trim();
      const username = document.getElementById('newUserUsername').value.trim();
      const password = document.getElementById('newUserPassword').value.trim();

      if (!name || !username || !password) {
        alert('لطفاً تمام فیلدهای کاربر را پر کنید.');
        return;
      }

      const { error } = await supabaseClient.from('app_users').insert([
        { name: name, username: username, password: password, role: 'user' }
      ]);

      if (error) {
        alert('خطا در ساخت کاربر: ' + error.message);
        return;
      }

      alert(`کاربر ${name} با موفقیت ایجاد شد.`);
      document.getElementById('newUserName').value = '';
      document.getElementById('newUserUsername').value = '';
      document.getElementById('newUserPassword').value = '';
      loadData();
    }

    async function updateProgress(id, val) {
      await supabaseClient.from('tasks').update({ progress: val }).eq('id', id);
    }

    async function updateDetails(id, val) {
      await supabaseClient.from('tasks').update({ details: val }).eq('id', id);
    }

    async function deleteTask(id) {
      if (!confirm('آیا از حذف این ردیف مطمئن هستید؟')) return;
      await supabaseClient.from('tasks').delete().eq('id', id);
      loadData();
    }

    window.onload = initApp;
  </script>
</body>
</html>
