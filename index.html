<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروژه اسفندیار</title>
  <!-- بارگذاری کتابخانه Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f3f5f9; color: #172033;
      font: 14px/1.8 Tahoma, 'Segoe UI', Arial, sans-serif;
    }
    .wrap { max-width: 1200px; margin: auto; padding: 20px; }
    .panel {
      background: white; border: 1px solid #e3e7ee; border-radius: 12px;
      padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: #0f172a; }
    button, input, select, textarea {
      font-family: inherit; font-size: 14px; padding: 8px 12px;
      border: 1px solid #cbd5e1; border-radius: 8px; outline: none;
    }
    button {
      background: #2563eb; color: white; border: none; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #1d4ed8; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: right; vertical-align: middle; }
    th { background: #f8fafc; color: #334155; }
    .hidden { display: none !important; }
    .flex { display: flex; gap: 10px; align-items: center; }
    .space-between { justify-content: space-between; }
    .alert { padding: 12px; border-radius: 8px; margin-bottom: 15px; background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- بخش لاگین -->
    <div id="loginPanel" class="panel" style="max-width: 400px; margin: 50px auto;">
      <h2>ورود به سامانه اسفندیار</h2>
      <div id="loginError" class="alert hidden"></div>
      <div style="margin-bottom: 15px;">
        <label>نام کاربری:</label><br>
        <input type="text" id="loginUser" style="width: 100%; margin-top: 5px;" value="mahbod">
      </div>
      <div style="margin-bottom: 20px;">
        <label>رمز عبور:</label><br>
        <input type="password" id="loginPass" style="width: 100%; margin-top: 5px;" value="@Aida1387@">
      </div>
      <button onclick="handleLogin()" style="width: 100%;">ورود به سیستم</button>
    </div>

    <!-- بخش اصلی برنامه -->
    <div id="appPanel" class="panel hidden">
      <div class="flex space-between" style="margin-bottom: 20px;">
        <h2>پروژه اسفندیار (سامانه ردیابی پیشرفت)</h2>
        <div class="flex">
          <span id="userInfo" style="font-weight: bold; color: #475569;"></span>
          <button class="danger" onclick="handleLogout()">خروج</button>
        </div>
      </div>

      <div id="adminControls" class="hidden" style="margin-bottom: 20px; background: #f1f5f9; padding: 15px; border-radius: 8px;">
        <h3>مدیریت فعالیت‌ها و کاربران</h3>
        <div class="flex" style="flex-wrap: wrap; gap: 10px;">
          <input type="text" id="newTaskDesc" placeholder="شرح کار جدید..." style="flex: 2; min-width: 200px;">
          <input type="text" id="newTaskDate" placeholder="تاریخ انجام (مثلا ۱۴۰۵/۰۲/۱۵)" style="flex: 1; min-width: 150px;">
          <select id="newTaskAssignee" style="flex: 1; min-width: 150px;"></select>
          <button onclick="addTask()">اضافه کردن فعالیت</button>
        </div>
      </div>

      <h3>لیست فعالیت‌ها</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ردیف</th>
              <th>شرح کار</th>
              <th>تاریخ انجام</th>
              <th>پیگیری‌کننده</th>
              <th>توضیحات و مدارک</th>
              <th>پیشرفت کار</th>
              <th id="actionTh" class="hidden">مدیریت</th>
            </tr>
          </thead>
          <tbody id="taskTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // تنظیمات اتصال به Supabase شما
    const SUPABASE_URL = 'https://bdieqelvtlcwlgjgylmb.supabase.co';
    const SUPABASE_KEY = 'GAPGPTMASKTOKENpv9t4gwntxgX0X';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let tasks = [];
    let users = [];

    async function handleLogin() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');

      const { data, error } = await supabaseClient
        .from('app_users')
        .select('*')
        .eq('username', u)
        .eq('password', p)
        .single();

      if (error || !data) {
        errBox.textContent = 'نام کاربری یا رمز عبور اشتباه است.';
        errBox.classList.remove('hidden');
        return;
      }

      errBox.classList.add('hidden');
      currentUser = data;
      sessionStorage.setItem('esfandiar_user', JSON.stringify(currentUser));
      initApp();
    }

    function handleLogout() {
      currentUser = null;
      sessionStorage.removeItem('esfandiar_user');
      document.getElementById('appPanel').classList.add('hidden');
      document.getElementById('loginPanel').classList.remove('hidden');
    }

    async function loadData() {
      // دریافت کاربران
      const uRes = await supabaseClient.from('app_users').select('*');
      if (uRes.data) users = uRes.data;

      // دریافت تسک‌ها
      const tRes = await supabaseClient.from('tasks').select('*').order('id', { ascending: true });
      if (tRes.data) tasks = tRes.data;

      renderTasks();
      renderAssignees();
    }

    async function initApp() {
      const saved = sessionStorage.getItem('esfandiar_user');
      if (!saved) {
        document.getElementById('loginPanel').classList.remove('hidden');
        document.getElementById('appPanel').classList.add('hidden');
        return;
      }
      currentUser = JSON.parse(saved);
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('appPanel').classList.remove('hidden');
      document.getElementById('userInfo').textContent = `کاربر: ${currentUser.name || currentUser.username} (${currentUser.role === 'admin' ? 'مدیر' : 'همکار'})`;

      if (currentUser.role === 'admin') {
        document.getElementById('adminControls').classList.remove('hidden');
        document.getElementById('actionTh').classList.remove('hidden');
      } else {
        document.getElementById('adminControls').classList.add('hidden');
        document.getElementById('actionTh').classList.add('hidden');
      }

      await loadData();
    }

    function renderAssignees() {
      const sel = document.getElementById('newTaskAssignee');
      if (!sel) return;
      sel.innerHTML = '';
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.username;
        opt.textContent = `${u.name || u.username} (${u.username})`;
        sel.appendChild(opt);
      });
    }

    function renderTasks() {
      const tbody = document.getElementById('taskTableBody');
      tbody.innerHTML = '';

      if (tasks.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="7" style="text-align: center; color: #64748b;">هنوز فعالیتی ثبت نشده است.</td>`;
        tbody.appendChild(tr);
        return;
      }

      tasks.forEach((t, index) => {
        const tr = document.createElement('tr');
        const isAdmin = currentUser.role === 'admin';
        // کاربر معمولی فقط تسک‌های خودش یا تسک‌هایی که assignee هستند را می‌تواند پیشرفتشان را عوض کند
        const isMyTask = t.assignee === currentUser.username;
        const canEditProgress = isAdmin || isMyTask;

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${t.description || ''}</td>
          <td>${t.due_date || ''}</td>
          <td>${t.assignee || ''}</td>
          <td><input type="text" value="${t.details || ''}" onchange="updateDetails(${t.id}, this.value)" ${canEditProgress ? '' : 'disabled'} style="width: 100%;"></td>
          <td>
            <select onchange="updateProgress(${t.id}, this.value)" ${canEditProgress ? '' : 'disabled'}>
              <option value="انجام نشده" ${t.progress === 'انجام نشده' ? 'selected' : ''}>انجام نشده</option>
              <option value="در حال انجام" ${t.progress === 'در حال انجام' ? 'selected' : ''}>در حال انجام</option>
              <option value="تکمیل شده" ${t.progress === 'تکمیل شده' ? 'selected' : ''}>تکمیل شده</option>
            </select>
          </td>
          ${isAdmin ? `<td><button class="danger" onclick="deleteTask(${t.id})">حذف</button></td>` : ''}
        `;
        tbody.appendChild(tr);
      });
    }

    async function addTask() {
      const desc = document.getElementById('newTaskDesc').value.trim();
      const date = document.getElementById('newTaskDate').value.trim();
      const assignee = document.getElementById('newTaskAssignee').value;

      if (!desc) {
        alert('لطفا شرح کار را وارد کنید.');
        return;
      }

      const { error } = await supabaseClient.from('tasks').insert([
        { description: desc, due_date: date, assignee: assignee, progress: 'انجام نشده', details: '' }
      ]);

      if (error) {
        alert('خطا در ثبت فعالیت: ' + error.message);
        return;
      }

      document.getElementById('newTaskDesc').value = '';
      document.getElementById('newTaskDate').value = '';
      loadData();
    }

    async function updateProgress(id, val) {
      await supabaseClient.from('tasks').update({ progress: val }).eq('id', id);
      loadData();
    }

    async function updateDetails(id, val) {
      await supabaseClient.from('tasks').update({ details: val }).eq('id', id);
      loadData();
    }

    async function deleteTask(id) {
      if (!confirm('آیا از حذف این فعالیت اطمینان دارید؟')) return;
      await supabaseClient.from('tasks').delete().eq('id', id);
      loadData();
    }

    // بررسی ورود اولیه هنگام باز شدن صفحه
    window.onload = initApp;
  </script>
</body>
</html>
