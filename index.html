<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه احداث ساختمان اسفندیار - شرکت مهراصل</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --muted-bg: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            direction: rtl;
        }

        .header-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-brand img {
            height: 55px;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 0.85rem;
            color: #64748b;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        #login-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .login-box {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-box h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            background: white;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .shamsi-group {
            display: flex;
            gap: 6px;
        }

        .shamsi-group select {
            flex: 1;
            padding: 8px 4px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.85rem;
            background: white;
        }

        .btn {
            padding: 9px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .table-container {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: right;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            padding: 12px 14px;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .cell-readonly {
            background-color: var(--muted-bg) !important;
            color: #475569;
            cursor: not-allowed;
        }

        .progress-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-slider {
            flex-grow: 1;
        }

        .file-link {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            text-decoration: none;
            margin: 2px;
        }

        .file-link:hover {
            background: #bae6fd;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            >سامانه پیگیری و مدیریت فعالیت‌های اجرایی - شرکت مهراصل</p>
            </div>
        </div>
        <div class="user-panel">
            <span id="current-user-info" class="badge">در حال بارگذاری...</span>
            <button id="btn-add-task" class="btn btn-success" style="display: none;" onclick="openNewTaskModal()">+ فعالیت جدید</button>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="logout()">خروج</button>
        </div>
    </header>

    <div class="table-container">
        <table id="tasks-table">
            <thead>
                <tr>
                    <th style="width: 45px; text-align: center;">ردیف</th>
                    <th>شرح فعالیت</th>
                    <th style="width: 130px;">پیگیری‌کننده</th>
                    <th style="width: 110px;">تاریخ ثبت</th>
                    <th style="width: 110px;">مهلت انجام</th>
                    <th style="width: 160px;">تاریخ انجام</th>
                    <th style="width: 230px;">اقدامات و درصد</th>
                    <th>توضیحات و فایل‌ها</th>
                    <th id="actions-header" style="width: 80px; text-align: center; display: none;">عملیات</th>
                </tr>
            </thead>
            <tbody id="tasks-body">
                <tr>
                    <td colspan="9" style="text-align: center; padding: 24px; color: #64748b;">در حال دریافت اطلاعات از سرور...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- پنجره لاگین -->
    <div id="login-modal">
        <div class="login-box">
            <h2>ورود به سامانه اسفندیار</h2>
            <div class="form-group">
                <label>انتخاب نقش / کاربر:</label>
                <select id="login-user-select" class="form-control" onchange="onUserSelectionChange()">
                    <option value="" disabled selected>-- لطفاً کاربر را انتخاب کنید --</option>
                    <option value="user1">کاربر یک (رییس کارگاه)</option>
                    <option value="user2">کاربر دو (مهندس اجرا)</option>
                    <option value="user3">کاربر سه (دفتر فنی)</option>
                    <option value="user4">کاربر چهار (ایمنی)</option>
                    <option value="mahbod">مهندس مهبد (مدیر پروژه)</option>
                </select>
            </div>

            <div class="form-group" id="password-group" style="display: none;">
                <label>رمز عبور
