<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه احداث ساختمان اسفندیار - شرکت مهراصل</title>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #172554;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #cbd5e1;
            --text: #0f172a;
            --muted-bg: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            direction: rtl;
        }

        .header-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-brand img {
            height: 55px;
            object-fit: contain;
        }

        .header-title h1 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 0.85rem;
            color: #64748b;
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        /* بخش لاگین */
        #login-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .login-box {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-box h2 {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        /* جدول فعالیت‌ها */
        .table-container {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: right;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            padding: 12px 14px;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .read-only {
            background-color: var(--muted-bg) !important;
            color: #64748b;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* نوارهای پیشرفت و فرم‌ها */
        .progress-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-slider {
            flex-grow: 1;
        }

        .file-link {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            text-decoration: none;
            margin: 2px;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <!-- هدر سایت -->
    <header class="header-card">
        <div class="header-brand">
            <img src="logo.webp" alt="شرکت مهراصل" onerror="this.src='images.webp';">
            <div class="header-title">
                <h1>پروژه احداث ساختمان اسفندیار</h1>
                <p>سامانه پیگیری و مدیریت فعالیت‌های اجرایی</p>
            </div>
        </div>
        <div class="user-panel">
            <span id="current-user-info" class="badge">در حال بارگذاری...</span>
            <button id="btn-add-task" class="btn btn-success" style="display: none;" onclick="openNewTaskModal()">+ فعالیت جدید</button>
            <button class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;" onclick="logout()">خروج</button>
        </div>
    </header>

    <!-- جدول اطلاعات -->
    <div class="table-container">
        <table id="tasks-table">
            <thead>
                <tr>
                    <th style="width: 50px;">ردیف</th>
                    <th>شرح فعالیت</th>
                    <th>پیگیری‌کننده</th>
                    <th>تاریخ ثبت</th>
                    <th>مهلت انجام</th>
                    <th>تاریخ انجام</th>
                    <th style="width: 220px;">اقدامات و درصد</th>
                    <th>توضیحات و فایل‌ها</th>
                    <th id="actions-header" style="width: 90px; display: none;">عملیات</th>
                </tr>
            </thead>
            <tbody id="tasks-body">
                <tr>
                    <td colspan="9" style="text-align: center; padding: 24px; color: #64748b;">در حال خواندن اطلاعات...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- مودال ورود -->
    <div id="login-modal">
        <div class="login-box">
            <h2>ورود به سامانه اسفندیار</h2>
            <div class="form-group">
                <label>انتخاب نقش / نام کاربری:</label>
                <select id="login-user-select" class="form-control" onchange="togglePasswordInput()">
                    <option value="" disabled selected>-- انتخاب کاربر --</option>
                    <option value="user1">کاربر یک (رییس کارگاه)</option>
                    <option value="user2">کاربر دو (مهندس اجرا)</option>
                    <option value="user3">کاربر سه (دفتر فنی)</option>
                    <option value="user4">کاربر چهار (ایمنی)</option>
                    <option value="mahbod">مهندس مهبد (مدیر پروژه)</option>
                </select>
            </div>

            <div class="form-group" id="password-group" style="display: none;">
                <label>رمز عبور مدیر:</label>
                <input type="password" id="login-password" class="form-control" placeholder="رمز عبور مدیر">
            </div>

            <p id="login-error" class="error-msg"></p>
            <button type="button" id="btn-submit-login" class="btn btn-primary" onclick="handleLogin()">ورود به برنامه</button>
        </div>
    </div>

    <!-- مودال افزودن/ویرایش تسک برای مدیر -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-task-title" style="margin-bottom: 16px; color: var(--primary);">ثبت فعالیت جدید</h3>
            <form id="task-form" onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label>شرح فعالیت:</label>
                    <textarea id="task-description" class="form-control" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>پیگیری‌کننده:</label>
                    <select id="task-assignee" class="form-control" required>
                        <option value="user1">کاربر یک (رییس کارگاه)</option>
                        <option value="user2">کاربر دو (مهندس اجرا)</option>
                        <option value="user3">کاربر سه (دفتر فنی)</option>
                        <option value="user4">کاربر چهار (ایمنی)</option>
                    </select>
                </div>
                <div style="display: flex; gap: 12px;">
                    <div class="form-group" style="flex: 1;">
                        <label>مهلت انجام (شمسی):</label>
                        <input type="text" id="task-due-date" class="form-control" placeholder="مثال: 1405/08/20">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>تاریخ ثبت:</label>
                        <input type="text" id="task-created-date" class="form-control" placeholder="1405/08/16">
                    </div>
                </div>
                <div class="form-group">
                    <label>پیوست فایل‌ها (آپلود به سرور):</label>
                    <input type="file" id="task-files-input" class="form-control" multiple>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <button type="button" class="btn" style="background:#cbd5e1;" onclick="closeModal()">انصراف</button>
                    <button type="submit" class="btn btn-primary" id="btn-save-task">ذخیره فعالیت</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // تنظیمات Supabase
        const SUPABASE_URL = "https://bdieqelvtlcwlgjgylmb.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkaWVxZWx2dGxjd2xnamd5bG1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzk3OTU2OTQsImV4cCI6MjA1NTM3MTY5NH0.Z9zU9hC33mD-vWf7t5-lJbS0W3-Lg9J5vYkK5xL5_g"; // در صورت وجود کلید اختصاصی پروژه استفاده شود
        
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const USERS_MAP = {
            'mahbod': { name: 'مهندس مهبد', title: 'مدیر پروژه', role: 'admin' },
            'user1': { name: 'کاربر یک', title: 'رییس کارگاه', role: 'user' },
            'user2': { name: 'کاربر دو', title: 'مهندس اجرا', role: 'user' },
            'user3': { name: 'کاربر سه', title: 'دفتر فنی', role: 'user' },
            'user4': { name: 'کاربر چهار', title: 'ایمنی', role: 'user' }
        };

        let currentUser = null;
        let tasksList = [];

        function initApp() {
            const saved = localStorage.getItem('esfandiar_session');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    setupUI();
                    loadTasks();
                    return;
                } catch(e) {
                    localStorage.removeItem('esfandiar_session');
                }
            }
            document.getElementById('login-modal').style.display = 'flex';
        }

        function togglePasswordInput() {
            const val = document.getElementById('login-user-select').value;
            const passGrp = document.getElementById('password-group');
            if (val === 'mahbod') {
                passGrp.style.display = 'block';
            } else {
                passGrp.style.display = 'none';
            }
            document.getElementById('login-error').style.display = 'none';
        }

        function handleLogin() {
            const userSelect = document.getElementById('login-user-select').value;
            const passInput = document.getElementById('login-password').value;
            const errBox = document.getElementById('login-error');

            if (!userSelect) {
                errBox.innerText = 'لطفاً نام کاربری را انتخاب کنید.';
                errBox.style.display = 'block';
                return;
            }

            // لاگین مدیر
            if (userSelect === 'mahbod') {
                if (passInput !== '@Aida1387@') {
                    errBox.innerText = 'رمز عبور مدیر صحیح نمی‌باشد.';
                    errBox.style.display = 'block';
                    return;
                }
            }

            // ورود موفق
            currentUser = {
                username: userSelect,
                ...USERS_MAP[userSelect]
            };

            localStorage.setItem('esfandiar_session', JSON.stringify(currentUser));
            document.getElementById('login-modal').style.display = 'none';
            setupUI();
            loadTasks();
        }

        function logout() {
            localStorage.removeItem('esfandiar_session');
            currentUser = null;
            location.reload();
        }

        function setupUI() {
            document.getElementById('current-user-info').innerText = `${currentUser.name} (${currentUser.title})`;
            if (currentUser.role === 'admin') {
                document.getElementById('btn-add-task').style.display = 'inline-flex';
                document.getElementById('actions-header').style.display = 'table-cell';
            } else {
                document.getElementById('btn-add-task').style.display = 'none';
                document.getElementById('actions-header').style.display = 'none';
            }
        }

        async function loadTasks() {
            const tbody = document.getElementById('tasks-body');
            tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 24px;">در حال دریافت اطلاعات...</td></tr>`;

            const { data, error } = await client
                .from('tasks')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; color: red;">خطا در دریافت اطلاعات: ${error.message}</td></tr>`;
                return;
            }

            tasksList = data || [];
            renderTasks();
        }

        function renderTasks() {
            const tbody = document.getElementById('tasks-body');
            if (tasksList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align: center; padding: 24px; color: #64748b;">هیچ فعالیتی ثبت نشده است.</td></tr>`;
                return;
            }

            tbody.innerHTML = tasksList.map((t, idx) => {
                const isAssigned = (currentUser.role === 'admin') || (t.assignee === currentUser.username);
                const readOnlyClass = !isAssigned ? 'read-only' : '';
                const assigneeTitle = USERS_MAP[t.assignee]?.title || t.assignee;

                return `
                    <tr>
                        <td style="text-align: center; font-weight: bold;">${idx + 1}</td>
                        <td class="${currentUser.role !== 'admin' ? 'read-only' : ''}">${t.description || '-'}</td>
                        <td class="${currentUser.role !== 'admin' ? 'read-only' : ''}">
                            <span class="badge" style="background:#f1f5f9; color:#334155;">${assigneeTitle}</span>
                        </td>
                        <td class="${currentUser.role !== 'admin' ? 'read-only' : ''}">${t.created_date || '-'}</td>
                        <td class="${currentUser.role !== 'admin' ? 'read-only' : ''}">${t.due_date || '-'}</td>
                        <td class="${readOnlyClass}">
                            <input type="text" class="form-control" style="font-size: 0.8rem; padding: 4px;" 
                                value="${t.completion_date || ''}" 
                                placeholder="تاریخ انجام"
                                onchange="updateTaskField(${t.id}, 'completion_date', this.value)"
                                ${!isAssigned ? 'disabled' : ''}>
                        </td>
                        <td class="${readOnlyClass}">
                            <div class="progress-box">
                                <input type="range" class="progress-slider" min="0" max="100" value="${t.progress || 0}" 
                                    onchange="updateTaskField(${t.id}, 'progress', this.value)"
                                    oninput="this.nextElementSibling.innerText = this.value + '%'"
                                    ${!isAssigned ? 'disabled' : ''}>
                                <span style="font-size: 0.8rem; min-width: 35px;">${t.progress || 0}%</span>
                            </div>
                            <input type="text" class="form-control" style="font-size: 0.8rem; margin-top: 4px; padding: 4px;"
                                value="${t.actions || ''}" placeholder="شرح اقدامات..."
                                onchange="updateTaskField(${t.id}, 'actions', this.value)"
                                ${!isAssigned ? 'disabled' : ''}>
                        </td>
                        <td class="${currentUser.role !== 'admin' ? 'read-only' : ''}">
                            <div style="font-size: 0.8rem; margin-bottom: 4px;">${t.details || '-'}</div>
                            ${renderFiles(t.files)}
                        </td>
                        ${currentUser.role === 'admin' ? `
                            <td style="text-align: center;">
                                <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteTask(${t.id})">حذف</button>
                            </td>
                        ` : ''}
                    </tr>
                `;
            }).join('');
        }

        function renderFiles(files) {
            if (!files || !files.length) return '';
            return files.map(f => `<a href="${f.url}" target="_blank" class="file-link">📎 ${f.name}</a>`).join('');
        }

        async function updateTaskField(id, field, value) {
            const updateObj = {};
            updateObj[field] = value;
            const { error } = await client.from('tasks').update(updateObj).eq('id', id);
            if (error) {
                alert('خطا در ذخیره‌سازی تغییرات: ' + error.message);
            }
        }

        function openNewTaskModal() {
            document.getElementById('task-id').value = '';
            document.getElementById('task-form').reset();
            document.getElementById('modal-task-title').innerText = 'ثبت فعالیت جدید';
            document.getElementById('task-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('task-modal').style.display = 'none';
        }

        async function saveTask(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-task');
            btn.innerText = 'در حال ذخیره...';
            btn.disabled = true;

            const desc = document.getElementById('task-description').value;
            const assignee = document.getElementById('task-assignee').value;
            const dueDate = document.getElementById('task-due-date').value;
            const createdDate = document.getElementById('task-created-date').value;
            const fileInput = document.getElementById('task-files-input');

            let uploadedFiles = [];
            if (fileInput.files.length > 0) {
                for (let file of fileInput.files) {
                    const ext = file.name.split('.').pop();
                    const path = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
                    const { data: uploadData, error: uploadErr } = await client.storage
                        .from('task-files')
                        .upload(path, file);

                    if (!uploadErr) {
                        const { data: { publicUrl } } = client.storage.from('task-files').getPublicUrl(path);
                        uploadedFiles.push({ name: file.name, url: publicUrl });
                    }
                }
            }

            const { error } = await client.from('tasks').insert([{
                description: desc,
                assignee: assignee,
                due_date: dueDate,
                created_date: createdDate,
                files: uploadedFiles,
                progress: 0,
                actions: '',
                completion_date: ''
            }]);

            btn.innerText = 'ذخیره فعالیت';
            btn.disabled = false;

            if (error) {
                alert('خطا در ثبت فعالیت: ' + error.message);
            } else {
                closeModal();
                loadTasks();
            }
        }

        async function deleteTask(id) {
            if (!confirm('آیا از حذف این فعالیت اطمینان دارید؟')) return;
            const { error } = await client.from('tasks').delete().eq('id', id);
            if (!error) {
                loadTasks();
            } else {
                alert('خطا در حذف: ' + error.message);
            }
        }

        // راه‌اندازی اولیه
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
